# Builds the site and deploys it to GitHub Pages on every push to master (and on demand).
# A pull request only builds the site, so a broken change shows up before it is merged.
# A failed build or deploy of master opens an issue assigned to the repository owner (.github/failure-issue.sh),
# so he gets an e-mail; the next successful deploy closes it.
name: Deploy na GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read   # needed by actions/deploy-pages since v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  notify:
    needs: [build, deploy]
    if: always() && !cancelled() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FAILED: ${{ contains(needs.*.result, 'failure') }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github

      - name: Open or update the issue (sends an e-mail), or close it when the deploy passed
        run: |
          .github/failure-issue.sh "Nasazení webu selhalo" "$FAILED" "Běh: $RUN_URL
          Commit: ${GITHUB_SHA::7}

          Web se nepostavil nebo nenasadil, na webu zůstává předchozí verze. Podrobnosti jsou v běhu."
